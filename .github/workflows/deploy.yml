name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          # Optional repo variable PAGES_BASE_PATH (Settings > Secrets and variables > Actions > Variables).
          # Set it to "/" if you use a custom domain.
          BASE_OVERRIDE: ${{ vars.PAGES_BASE_PATH }}
        run: |
          if [ -n "$BASE_OVERRIDE" ]; then BASE="$BASE_OVERRIDE"
          elif [ -f CNAME ]; then BASE="/"   # custom domain => served from root
          elif [[ "$REPO_NAME" == *.github.io ]]; then BASE="/"
          else BASE="/$REPO_NAME"; fi
          BASE="${BASE%/}"   # vite config appends the trailing slash
          echo "Building with base='$BASE/'"
          FIGMA_PUBLIC_URL="$BASE" pnpm build

      - name: Add SPA 404 fallback and CNAME
        run: |
          cp dist/index.html dist/404.html
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
